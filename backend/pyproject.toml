[project]
name = "costopt"
version = "0.1.0"
description = "Local-first CostOpt MVP workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "langgraph>=1.0.0",
  "langsmith>=0.1.81",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "uvicorn[standard]>=0.30.0",
  "ortools>=9.11.0",
  "pyxlsb>=1.0.10",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
